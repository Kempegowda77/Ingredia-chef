<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Chef hat brim (base band) -->
  <rect x="18" y="26" width="28" height="5" rx="2.5" fill="white"/>

  <!-- Chef hat puffs (3 bumps on top) -->
  <circle cx="24" cy="22" r="6" fill="white"/>
  <circle cx="32" cy="19" r="7" fill="white"/>
  <circle cx="40" cy="22" r="6" fill="white"/>

  <!-- Ear left -->
  <circle cx="15" cy="42" r="4" fill="white"/>
  <!-- Ear left inner -->
  <circle cx="15" cy="42" r="2" fill="#10B981"/>

  <!-- Ear right -->
  <circle cx="49" cy="42" r="4" fill="white"/>
  <!-- Ear right inner -->
  <circle cx="49" cy="42" r="2" fill="#10B981"/>

  <!-- Face circle -->
  <circle cx="32" cy="42" r="13" fill="white"/>

  <!-- Eyes -->
  <circle cx="27" cy="40" r="2.5" fill="#1a2e1a"/>
  <circle cx="37" cy="40" r="2.5" fill="#1a2e1a"/>

  <!-- Eye shine -->
  <circle cx="28" cy="39" r="0.8" fill="white"/>
  <circle cx="38" cy="39" r="0.8" fill="white"/>

  <!-- Smile -->
  <path d="M26 46 Q32 51 38 46" stroke="#1a2e1a" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
